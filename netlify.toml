[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = ".next"

[functions]
  directory = "netlify/functions"

# Scheduled scrape: fires every 15 minutes; the function itself decides whether to run
# (every 15 min 9am-5pm Chicago time, top of the hour otherwise). See netlify/functions/scheduled-scrape.ts
[[scheduled_functions]]
  function = "scheduled-scrape"
  cron = "*/15 * * * *"
