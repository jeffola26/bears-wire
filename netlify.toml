[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = ".next"

[functions]
  directory = "netlify/functions"

# Scheduled function for scraping articles every 15 minutes (9am-5pm Chicago = 3pm-11pm UTC)
[[scheduled_functions]]
  function = "scheduled-scrape"
  cron = "0,15,30,45 15-23 * * *"
