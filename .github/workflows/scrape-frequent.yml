name: Scrape Articles - Frequent (Daytime)
on:
  schedule:
    - cron: '*/15 14-22 * * *'  # Every 15 minutes, 2pm-10pm UTC (covers 9am-5pm Chicago)
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Scrape articles
        run: |
          curl -X GET https://bearswire.netlify.app/api/scrape
      - name: Fetch OG images
        run: |
          curl -X GET https://bearswire.netlify.app/api/scrape-images
