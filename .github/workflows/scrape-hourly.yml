name: Scrape Articles - Hourly (Nighttime)
on:
  schedule:
    - cron: '0 22-23,0-8 * * *'  # Every hour, 10pm-8am UTC (covers 5pm-9am Chicago)
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Scrape articles
        run: |
          curl -X GET https://bearswire.netlify.app/api/scrape
      - name: Fetch OG images
        run: |
          curl -X GET https://bearswire.netlify.app/api/scrape-images
